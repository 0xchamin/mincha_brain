name: pages

# Publishes the mobile reader to GitHub Pages on every push to main.
# The site is a pure render of brain/ + sources/ - nothing here is a source of
# truth, so a failed build never costs anything but the deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install markdown pillow

      - name: Validate the contract
        run: python3 validate.py

      - name: Build the site
        run: python3 tools/build_site.py

      # enablement turns Pages on for the repo on the first run, so no manual
      # visit to Settings -> Pages is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
